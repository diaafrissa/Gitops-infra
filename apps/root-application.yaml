apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  finalizers:
    - resources-finalizers.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/diaa.frissan.1-group/Gitops-infra.git
    targetRevision: HEAD
    path: 'apps/manifests'  
  destination:
    server: 'https://kubernetes.default.svc' 
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      prune: true
      selfHeal: true 
